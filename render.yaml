databases:
  - name: global-chronicle-db
    plan: free
    databaseName: global_chronicle
    user: global_chronicle

services:
  - type: web
    name: global-chronicle-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn nexa.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/feed/?page=1&pageSize=1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-chronicle-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: NEWS_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
